global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  # 1. Scrape target: Prometheus internal metrics
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  # 2. Scrape target: Node Exporter (Host System Metrics)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # 3. Scrape target: cAdvisor (Container Resource Metrics)
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
